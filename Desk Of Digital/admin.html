<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOD Admin — Leads</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#071A38;color:#fff}*{box-sizing:border-box}.wrap{max-width:1200px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-weight:800;letter-spacing:.08em}.btn{border:1px solid #2B7BE9;background:#0B4DB8;color:#fff;border-radius:10px;padding:11px 16px;cursor:pointer}.btn.alt{background:transparent}.login,.dash{background:#0b2148;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:28px}.login{max-width:430px;margin:12vh auto}.input{width:100%;padding:13px;margin:8px 0 14px;border-radius:10px;border:1px solid #38577f;background:#071A38;color:#fff}.err{color:#ff9b9b;margin:10px 0}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}.stat{background:#0b2148;border:1px solid rgba(255,255,255,.1);padding:20px;border-radius:16px}.num{font-size:28px;font-weight:800;margin-top:8px}.tablewrap{overflow:auto}.filters{display:flex;gap:10px;margin-bottom:18px}.filters .input{margin:0;max-width:300px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{text-align:left;padding:14px;border-bottom:1px solid rgba(255,255,255,.1)}.status{background:#071A38;color:#fff;border:1px solid #38577f;padding:8px;border-radius:8px}.muted{color:#9fb2cf}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;gap:15px}.filters{flex-direction:column}.filters .input{max-width:none}}</style></head><body><main class="wrap"><div id="login" class="login"><div class="brand">DESK OF DIGITAL / ADMIN</div><h1>Lead Command</h1><p class="muted">Sign in to manage website enquiries.</p><input id="email" class="input" type="email" placeholder="Admin email"><input id="password" class="input" type="password" placeholder="Password"><button id="loginBtn" class="btn">Sign in</button><div id="loginErr" class="err"></div></div><section id="app" hidden><div class="top"><div><div class="brand">DESK OF DIGITAL</div><h1 style="margin:8px 0 0">Lead Command Centre</h1></div><button id="logout" class="btn alt">Logout</button></div><div class="stats"><div class="stat">Total<div id="total" class="num">0</div></div><div class="stat">New<div id="new" class="num">0</div></div><div class="stat">Contacted<div id="contacted" class="num">0</div></div><div class="stat">Site Visits<div id="site_visit" class="num">0</div></div><div class="stat">Won<div id="won" class="num">0</div></div></div><div class="dash"><div class="filters"><input id="search" class="input" placeholder="Search name, phone, email or company"><select id="filter" class="input"><option value="">All statuses</option><option>new</option><option>contacted</option><option>qualified</option><option>site_visit</option><option>proposal</option><option>won</option><option>lost</option></select></div><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Name</th><th>Phone</th><th>Email</th><th>Service</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script>const SUPABASE_URL='https://dtxstmclnkqdadfmbcdi.supabase.co';const SUPABASE_KEY='sb_publishable_7kDK11dZ6bCM112KKjCZHg_OuKd936c';const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let leads=[];const $=id=>document.getElementById(id);async function load(){const {data,error}=await client.from('leads').select('*').order('created_at',{ascending:false});if(error){$('loginErr').textContent=error.message;return}leads=data||[];render()}function render(){const q=$('search').value.toLowerCase(), f=$('filter').value;const filtered=leads.filter(x=>(!f||x.status===f)&&(!q||[x.name,x.phone,x.email,x.company,x.service].some(v=>(v||'').toLowerCase().includes(q))));$('rows').innerHTML=filtered.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.email||'')}</td><td>${esc(x.service||'')}</td><td><select class="status" data-id="${x.id}">${['new','contacted','qualified','site_visit','proposal','won','lost'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('');const c=s=>leads.filter(x=>x.status===s).length;$('total').textContent=leads.length;$('new').textContent=c('new');$('contacted').textContent=c('contacted');$('site_visit').textContent=c('site_visit');$('won').textContent=c('won');document.querySelectorAll('.status').forEach(el=>el.onchange=async()=>{const {error}=await client.from('leads').update({status:el.value}).eq('id',el.dataset.id);if(error)alert(error.message);else{const item=leads.find(x=>x.id===el.dataset.id);if(item)item.status=el.value;render()}})}function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}$('loginBtn').onclick=async()=>{ $('loginErr').textContent='';const {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginErr').textContent=error.message;return}show()};$('logout').onclick=async()=>{await client.auth.signOut();location.reload()};$('search').oninput=render;$('filter').onchange=render;async function show(){const {data:{session}}=await client.auth.getSession();if(!session)return;$('login').hidden=true;$('app').hidden=false;await load()}client.auth.onAuthStateChange((event,session)=>{if(session)show()});show();</script></body></html>
